# fly.toml app configuration file generated for flowcounter on 2026-09-26T12:11:20+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flowcounter'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 2

[[restart]]
  policy = 'never'

[mounts]
source = "flowcounter_sqlite"
destination = "/data"
